[project]
dependencies = [ "cs00", "cs00-assignment-00", "marimo>=0.25.2" ]
name = "workspace"
requires-python = ">=3.12"
version = "0.0.0"

[dependency-groups]
docs = [
  "ipykernel>=6.29",
  "matplotlib>=3.10",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "plotly>=6.0",
  "sphinx>=8.0",
]
qc = [
  "bandit[toml]>=1.9.4",
  "black>=26.10.1",
  "detect-secrets>=1.5.0",
  "flake8>=7.5.0",
  "hadolint-py>=2.15.1.3",
  "interrogate>=1.7.0",
  "isort[colors]>=9.0.2",
  "lintquarto>=0.14.0",
  "marimo>=0.25.2",
  "mypy>=2.4.1",
  "pep8-naming>=0.15.1",
  "pip-audit>=2.10.1",
  "pre-commit-hooks>=6.0.0",
  "pre-commit>=4.7.0",
  "pydocstyle>=6.3.0",
  "pylint-per-file-ignores>=4.0.0",
  "pylint>=4.1.4",
  "pytest>=9.2.0",
  "radon>=6.0.1",
  "reuse[charset-normalizer]>=6.3.0",
  "ruff>=0.17.6",
  "shellcheck-py>=0.11.0.1",
  "toml-sort>=0.26.0",
  "ty>=0.0.109",
  "vulture>=2.16",
  "yamllint>=1.38.0",
]
visuals = [ "cs00-visuals" ]

[tool.uv.sources]
cs00 = {workspace = true}
cs00-assignment-00 = {workspace = true}
cs00-visuals = {workspace = true}

[tool.uv.workspace]
members = [ "assignments/*", "libs/*" ]
