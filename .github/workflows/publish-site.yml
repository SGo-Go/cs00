name: Publish site

on:
  push:
    branches: [main]
    paths:
      - docs/quarto/**
      - docs/sphinx/**
      - libs/**
      - assignments/**
      - pyproject.toml
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: astral-sh/setup-uv@v6
      # pycairo and manimpango have no Linux wheels, so they build against these libraries.
      - name: Install system libraries for Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config
      - name: Install Python dependencies
        run: uv sync --group docs --group visuals
      - name: Render visualizations
        run: uv run --no-sync python -m cs00_visuals.render --quality web
      - name: Render site
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render docs/quarto
      - name: Build API reference
        run: uv run --no-sync sphinx-build -W -b html docs/sphinx docs/quarto/_site/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/quarto/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
